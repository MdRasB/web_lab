<!DOCTYPE html>
<html>

<head>
    <title>Tech Fest 2026 — Registration</title>
</head>

<body>
    <header>
        <h1>Tech Fest 2026 — Registration</h1>
        <p>Dept. of Computer Science &amp; Engineering, BAUET</p>
        <hr>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name</label><br>
                <input type="text" id="name" name="name" placeholder="Your full name" required>
                <br><br>
                <label for="email">Institutional Email:</label><br>
                <input type="email" id="email" name="email" placeholder="id@bauet.ac.bd" required>
                <br><br>
                <label for="phone">Phone Number (11 digits):</label><br>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="01700000000">
                <br><br>
                <label for="studentid">Student ID (9 digits):</label><br>
                <input type="text" id="studentid" name="studentid" pattern="[0-9]{9}">
            </fieldset>

            <fieldset>
                <legend>Event Registration</legend>

                <p><strong>Participant Category:</strong></p>
                <input type="radio" id="undergraduate" name="category" value="undergraduate">
                <label for="undergraduate">Undergraduate</label><br>
                <input type="radio" id="postgraduate" name="category" value="postgraduate">
                <label for="postgraduate">Postgraduate</label><br>
                <input type="radio" id="faculty" name="category" value="faculty">
                <label for="faculty">Faculty / Industry</label>

                <p><strong>Events (select all that apply):</strong></p>
                <input type="checkbox" id="hackathon" name="events" value="hackathon">
                <label for="hackathon">Hackathon</label><br>
                <input type="checkbox" id="poster" name="events" value="poster">
                <label for="poster">Poster Presentation</label><br>
                <input type="checkbox" id="gaming" name="events" value="gaming">
                <label for="gaming">Gaming Contest</label><br>
                <input type="checkbox" id="robo" name="events" value="robo">
                <label for="robo">Robo Race</label>

                <p>
                    <label for="tshirt">T-Shirt Size:</label><br>
                    <select id="tshirt" name="tshirt">
                        <option value="">-- Select --</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Additional Details</legend>
                <label for="receipt">
                    Payment Receipt (PDF or PNG):
                </label><br>
                <input type="file" accept=".pdf,.png">

                <br><br>
                <label for="notes">
                    Special Requirements / Dietary Notes:
                </label><br>
                <textarea id="notes" name="notes" rows="4" cols="30" placeholder="Leave blank if none"></textarea>

            </fieldset>

            <br>

            <input type="submit" value="Submit Registration">
            <input type="reset" value="Clear Form">

        </form>
    </main>

    <footer>
        <hr>
        <p>Deadline: 5 August 2026 — BAUET Tech Fest Committee</p>
    </footer>
</body>

</html>
